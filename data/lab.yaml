intro: In our lab, we use a combination of theory, numerical methods, 3D printing and experiments.
sections:
- title: Numerical tools
  items:
  - You can visit our [GitLab repository](https://uva-hva.gitlab.host/published-projects) where our custom codes are uploaded. We code mostly in Python, sometimes in Matlab
  - In addition, we use the commercial softwares Abaqus and Comsol for finite element simulations
- title: Our mechanical testing equipment
  items:
  - Instron 5943 (single column, 1kN) with a 500N and a 5N load cells
  - Instron Electro pulse 3000TT (biaxial fatigue machine), with a 3000N/25Nm biaxial load cell
  - Instron 5985 (double column, 300kN) with a 300kN load cell, compression platens, 100kN and 30kN tension grips and a temperature chamber
  - Shaker Tira (1kN)
  - Custom made drop tower (up to 25kg at 6m/s)
- title: Our Cameras
  items:
  - 3D motion capture system (Qualisys Arqus A5)
  - Phantom VEO 640, 4MPx @ 1400fps
  - Ximea, 25MPx @ 330fps
  - 2 Basler 10MPx @ 14 fps (USB 3)
  - 2 Basler 4MPx @ 90 fps (USB 3)
  - 1 Basler 0.25MPx @750fps (USB 3)
- title: Our 3D printers
  items:
  - Mechatronics printer Kronos (to print plastics, conductive materials, pick and place components)
  - Metal printer Mlab 100R
  - Polyjet printer Connex Objet 500
  - Direct pellet extrusion 3D printer Pollen PAM o2 MC
  - Silicone 3d printer Lynxter S300X LIQ 21-LIQ 11
  - SLS 3d printer Formlabs 1+ 30W
  - SLA printers Formlabs 2 and Formlabs 3
  - Direct Ink printers Bioplotter Starters series and Hyrel engine SR
  - FDM printers Ultimaker, Felix and Bambu
