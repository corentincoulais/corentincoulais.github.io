intro: We are often seeking M.Sc. students, Ph.D. candidates, and Postdoctoral researchers (you can keep an eye on openings [here](https://werkenbij.uva.nl/en/vacancies?o=0&n=10&of=66543&hl=0&hh=38&s=0&ln=7108157#vacancy-overview)) to join our laboratory. If you are passionate about research and have interests in soft matter, soft mechanics or metamaterials, feel free to apply directly or contact [Prof. Coulais](mailto:coulais@uva.nl).
