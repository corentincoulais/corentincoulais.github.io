{# The interactive metamaterial animations (set in content/site.yaml under hero: visuals:). Used on the homepage and the About page. #}
{% set v0 = site.hero.visuals[0] %}
<figure class="hero-visual">
  <canvas class="lattice" data-mode="{{ v0.key }}" role="img" aria-label="Interactive animation of a metamaterial"></canvas>
  <div class="visual-switch" role="group" aria-label="Choose an animation">
    {% for v in site.hero.visuals %}
    <button type="button" data-visual="{{ v.key }}" data-caption="{{ v.caption }}" data-link="{{ v.link }}" data-link-text="{{ v.link_text }}" aria-pressed="{{ 'true' if loop.first else 'false' }}">{{ v.label }}</button>
    {% endfor %}
  </div>
  <figcaption class="visual-caption">
    <span class="visual-text">{{ v0.caption }}</span>
    <a class="visual-link" href="{{ v0.link }}"><span>{{ v0.link_text }}</span> →</a>
  </figcaption>
</figure>
